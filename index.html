<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>異史録</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 号外の紙面：鉄灰色の新聞紙、墨、プルシアンブルーの朱印代わり。一画面アプリ＋下部タブ */
:root{
  --paper:#e7e7e2;
  --sheet:#f3f3ef;
  --ink:#17191e;
  --muted:#5d6068;
  --rule:#b9bab4;
  --accent:#1f4e79;
  --ok:#2e6a3b;
  --part:#9a6a12;
  --ng:#a2262b;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:860px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px 88px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 10px;border-bottom:3px double var(--ink)}
header.top h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:.12em}
header.top .sub{font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:none;padding:4px 0;color:var(--accent);font-weight:700;font-size:13px}
h2{font-family:var(--display);font-size:20px;margin:18px 0 8px;text-wrap:balance}
h3{font-family:var(--display);font-size:16px;margin:14px 0 6px}
.note{font-size:13px;color:var(--muted)}
.card{background:var(--sheet);border:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:6px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ink);color:var(--sheet);border:none;padding:10px 16px;font-weight:700;letter-spacing:.04em}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.danger{background:transparent;color:var(--ng);border:1px solid var(--ng)}
.chip{border:1px solid var(--ink);background:transparent;padding:6px 10px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}
input[type=text],textarea,select{width:100%;background:#fff;border:1px solid var(--rule);padding:10px;border-radius:0}
textarea{min-height:140px;resize:vertical;line-height:1.6}
.camp{cursor:pointer;text-align:left}
.camp .t{font-family:var(--display);font-weight:700;font-size:17px}
.camp .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.roster{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;padding-right:2px}
.lord{display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--sheet);border:1px solid var(--rule);border-left:5px solid var(--c);padding:10px 14px;text-align:left}
.lord .n{font-family:var(--display);font-weight:700;font-size:19px}
.lord .k{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lord[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.lord[aria-pressed="true"] .k{color:#c9cac5}
.lord[hidden]{display:none}
.mapwrap{overflow:auto;background:#14161a;border:1px solid var(--ink);margin-top:10px;max-height:70vh;-webkit-overflow-scrolling:touch}
.mapwrap svg{display:block}
.mapwrap text{font-family:var(--body);font-size:10px;fill:#fff;pointer-events:none;font-weight:700;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:1.6px}
.mapwrap rect{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.tileinfo{font-size:14px;margin-top:8px;min-height:1.7em}
.tcard{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tcard.focus{border-color:var(--accent)}
.tcard .tn{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.2}
.tcard .sw{display:inline-block;width:14px;height:14px}
.tev p{margin:2px 0;font-size:14px}
.evdot{cursor:pointer}
.tolatest{position:fixed;right:16px;bottom:76px;z-index:6;background:var(--ink);color:var(--sheet);border:none;padding:8px 14px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mapwrap{touch-action:pan-x pan-y}
.crow{display:flex;gap:6px;align-items:stretch}
.crow .contact{flex:1;min-width:0}
.pin{flex:none;width:40px;background:var(--sheet);border:1px solid var(--rule);opacity:.45;font-size:15px}
.pin.on{opacity:1;border-color:var(--part);background:#f1ece0}
.bm{display:block;margin:4px 0 0 auto;background:none;border:none;opacity:.35;font-size:14px;padding:0}
.bm.on{opacity:1}
.msg.me .bm{filter:grayscale(1) brightness(2)}
.paper.chron .mast .eyebrow{font-family:var(--display);color:var(--accent);letter-spacing:.3em;font-size:13px;font-weight:700}
.olist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.oi{font-size:14px;border-bottom:1px dotted var(--rule);padding-bottom:6px}

.olab.ok{color:var(--ok)} .olab.part{color:var(--part)} .olab.ng{color:var(--ng)}
.oreason{font-size:13px;color:var(--muted);margin:4px 0 0 1em}
.truth{font-size:11px;font-weight:800;color:#fff;background:var(--ink);padding:1px 7px;margin-left:8px;letter-spacing:.2em}
.secret-ev{border-left:4px solid var(--ink);padding-left:12px;padding-right:6px;background:rgba(23,25,30,.04)}

.pick .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--sheet);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800}
.pick .cb{flex:1;min-width:0;display:flex;flex-direction:column}
.pick .cn{font-weight:700}
.pick .cs{font-size:12px;color:var(--muted)}
.pick .chk{flex:none;width:24px;height:24px;border:1.5px solid var(--rule);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.pick[aria-pressed="true"]{border-color:var(--part)}
.pick[aria-pressed="true"] .chk{background:var(--part);border-color:var(--part)}
.sect{font-size:13px;color:var(--muted);letter-spacing:.15em;margin-top:8px}
.composebar{position:sticky;bottom:64px;display:flex;justify-content:space-between;align-items:center;background:var(--paper);border-top:1px solid var(--rule);padding:8px 0}
#newfree[hidden]{display:none}
.mission{gap:6px;border-color:var(--accent)}
.slots{display:flex;gap:4px}
.slot{flex:1;height:8px;background:#d5d6d0}
.slot.act{background:var(--accent)} .slot.q{background:var(--part)} .slot.over{outline:2px solid var(--ng)}
.mi{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-top:1px dotted var(--rule);padding-top:4px}
.qsrc{font-size:11px;font-weight:700;color:var(--part);border:1px solid var(--part);padding:0 5px}
.cstats{display:flex;flex-wrap:wrap;gap:4px 16px;font-variant-numeric:tabular-nums;font-weight:700}
.cstats span,.pstats span{display:flex;flex-direction:column;line-height:1.3}
.cstats small,.pstats small{font-size:11px;color:var(--muted);font-weight:400}
.pstats{display:flex;flex-wrap:wrap;gap:4px 18px;font-variant-numeric:tabular-nums;font-weight:700}
.datebtn{background:none;border:none;text-align:right;padding:0}
.cal{margin-top:8px;gap:8px}
.calt{font-family:var(--display);font-size:20px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-variant-numeric:tabular-nums}
.calgrid .dow{font-size:12px;color:var(--muted)}
.calgrid .cd{padding:6px 0;font-size:14px;border:1px solid transparent;background:none}
.calgrid .cd.mark{border-color:var(--part);font-weight:700;cursor:pointer}
.calgrid .cd.cur{background:var(--part);color:#fff;font-weight:700}
.calprev{border-top:1px solid var(--rule);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.chip.small{padding:4px 9px;font-size:12px}
.maphead{display:flex;justify-content:space-between;gap:10px;background:var(--sheet);border:1px solid var(--rule);padding:10px 14px;margin-top:14px}
.maptools{margin-top:8px}
.quick{margin-top:10px}
.diff{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--sheet);border:1px solid var(--rule);padding:10px 14px}
.diff span{font-size:13px;color:var(--muted)}
.diff[aria-pressed="true"]{border-color:var(--part);background:#f1ece0}
.diff[aria-pressed="true"] strong{color:var(--part)}
.intro{border-bottom:1px solid var(--rule);padding-bottom:8px}
.intro p{line-height:1.8;margin:6px 0 0}
.ans{display:block;margin-top:6px;font-size:12px;font-weight:700;border:1px solid currentColor;padding:1px 8px;width:max-content}
.ans-合意{color:var(--ok)} .ans-条件付き{color:var(--part)} .ans-保留{color:var(--muted)} .ans-拒否{color:var(--ng)}
.agc{color:var(--accent)!important}
.sumcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);padding:10px 14px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.sumcard .sl{font-weight:700;font-size:13px}
.sumcard ul{margin:2px 0 0;padding-left:1.2em;font-size:14px}
.prop{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--part);background:#f1ece0;padding:8px 12px;max-width:92%}
.prop .btn{white-space:nowrap;flex:none}
.guide p{line-height:1.8}
.gtabs{margin-top:14px}
.eyebrow-g{color:var(--part);font-weight:700;letter-spacing:.3em;font-size:13px;margin-top:8px}
.gh{font-size:28px;margin:4px 0}
.gex{border-left:3px solid var(--part);padding:4px 0 4px 14px}
.shot{display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1px solid var(--ink);padding:10px;margin-top:8px}
.shot img{width:100%;height:auto;display:block}
.turnsep{font-family:var(--display);font-weight:800;letter-spacing:.2em;font-size:13px;border-bottom:2px solid var(--ink);padding:14px 0 2px;color:var(--muted)}
.udot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e2a93b;margin-left:4px;vertical-align:4px}
.udot.static{margin:0;flex:none;align-self:center}
.chronhead{text-align:center;padding:14px 0 10px;border-bottom:1px solid var(--rule)}
.chronhead .eyebrow{font-family:var(--display);color:var(--accent);letter-spacing:.3em;font-size:13px;font-weight:700}
.chronhead .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.2}
.chronhead .meta{font-size:13px;color:var(--muted);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.orders-log{margin:10px 0;font-size:14px}
.orders-log summary{cursor:pointer;font-weight:700}
.events{display:flex;flex-direction:column;margin-top:10px}
.ev{border-bottom:1px solid var(--rule);padding:12px 0}
.ev p{font-family:var(--display);font-size:18px;line-height:1.55;margin:4px 0 8px;font-weight:500}
.evh{display:flex;justify-content:space-between;align-items:baseline}
.cat{font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--accent)}
.cat.ng{color:var(--ng)} .cat.part{color:var(--part)}
.eff{font-size:12px;border:1px solid var(--rule);background:var(--sheet);padding:2px 8px;font-variant-numeric:tabular-nums}
.datebox{display:flex;justify-content:space-between;gap:10px;background:var(--sheet);border:1px solid var(--rule);padding:10px 14px;margin-top:14px}
.qi{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1px dotted var(--rule);padding-top:6px;font-size:14px}
.contact{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--sheet);border:1px solid var(--rule);padding:10px 12px;width:100%}
.contact .av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--sheet);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px}
.contact .av.in{background:var(--accent)}
.contact .cb{flex:1;min-width:0;display:flex;flex-direction:column}
.contact .cn{font-weight:700}
.contact .kind{font-size:11px;color:var(--muted);border:1px solid var(--rule);padding:0 5px;margin-left:6px;font-weight:400}
.contact .cs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest{text-align:left;border-color:var(--part);background:#f1ece0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mcard{background:var(--sheet);border:1px solid var(--rule);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mcard .mn{font-size:13px;font-weight:700}
.mcard .mv{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.mcard .mv small{font-size:13px;font-family:var(--body);color:var(--muted)}
.mcard .mp{font-family:var(--body);font-size:12px;margin-left:auto;color:var(--muted)}
.mcard svg{width:100%;height:34px}
.plan{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid var(--rule)}
.plan .pt{font-weight:700}
.plan .ps{font-size:13px;font-weight:700;color:var(--part);white-space:nowrap}
select{width:100%;background:#fff;border:1px solid var(--rule);padding:10px;border-radius:0}
nav.tabs button{font-size:13px;letter-spacing:.02em;padding:12px 2px}
/* 紙面 */
.paper{background:var(--sheet);border:1px solid var(--rule);padding:16px 18px 20px;margin-top:14px}
.mast{text-align:center;border-bottom:3px double var(--ink);padding-bottom:6px}
.mast .name{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.2em;line-height:1.2}
.mast .dl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--ink);margin-top:6px;padding-top:3px;font-variant-numeric:tabular-nums}
.headline{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.35;margin:14px 0 8px;text-wrap:balance}
.lead{font-weight:700;border-bottom:1px solid var(--rule);padding-bottom:10px;margin:0}
.arts{columns:2 260px;column-gap:22px;column-rule:1px solid var(--rule);margin-top:12px}
.art{break-inside:avoid;margin:0 0 14px}
.art h4{font-family:var(--display);font-size:17px;margin:0 0 4px;line-height:1.4}

.verd{border:2px solid var(--ink);padding:10px 12px;margin-top:6px}

.v{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:6px 0;border-bottom:1px dotted var(--rule)}
.v:last-child{border-bottom:none}

.v .o{font-weight:700} .v .r{grid-column:2;font-size:13px;color:var(--muted)}
.briefs{border-top:2px solid var(--ink);margin-top:10px;padding-top:6px}

.up{color:var(--ok)} .down{color:var(--ng)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}

/* 国情 */
.stat{display:grid;grid-template-columns:3.5em 1fr 2.5em;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#d5d6d0;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.att{height:8px;background:#d5d6d0;position:relative}
.att::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink)}
.att i{position:absolute;top:0;bottom:0}
.rv .n{font-weight:700}
.rv .s{font-size:12px;border:1px solid var(--ink);padding:0 6px;margin-left:6px}
.secret{font-size:13px;color:var(--ng);border-left:3px solid var(--ng);padding-left:8px}

.chat{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{padding:8px 12px;max-width:88%;white-space:pre-wrap}

.msg.them{align-self:flex-start;background:var(--sheet);border:1px solid var(--rule)}

@media (max-width:420px){
  .mast .name{font-size:26px}
  .headline{font-size:22px}
  .paper{padding:14px 12px 18px}
}

<div id="app"></div>
<script>
/* 異史録・無料移植アダプター（Gemini API + IndexedDB） */
(function(){
  "use strict";
  const KEY_NAME = "ishiroku_gemini_api_key";
  const MODEL = "gemini-3.8-flash";
  const DB_NAME = "ishiroku_local_db";
  const STORE = "docs";
  const getKey = () => { try { return localStorage.getItem(KEY_NAME) || ""; } catch(e) { return ""; } };
  const setKey = value => { try { if(value) localStorage.setItem(KEY_NAME, value); else localStorage.removeItem(KEY_NAME); } catch(e) { throw new Error("このブラウザではAPIキーを保存できません"); } };
  window.IshirokuAI = { hasKey: () => !!getKey(), setKey, removeKey: () => setKey("") };

  function openDB(){
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:"key"}); };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error("IndexedDBを開けません"));
    });
  }
  async function idbPut(key,value){ const db=await openDB(); return new Promise((resolve,reject)=>{ const tx=db.transaction(STORE,"readwrite"); tx.objectStore(STORE).put({key,value}); tx.oncomplete=()=>{db.close();resolve();}; tx.onerror=()=>{db.close();reject(tx.error);}; }); }
  async function idbDelete(key){ const db=await openDB(); return new Promise((resolve,reject)=>{ const tx=db.transaction(STORE,"readwrite"); tx.objectStore(STORE).delete(key); tx.oncomplete=()=>{db.close();resolve();}; tx.onerror=()=>{db.close();reject(tx.error);}; }); }
  async function idbGetAll(){ const db=await openDB(); return new Promise((resolve,reject)=>{ const tx=db.transaction(STORE,"readonly"); const req=tx.objectStore(STORE).getAll(); req.onsuccess=()=>{db.close();resolve(req.result||[]);}; req.onerror=()=>{db.close();reject(req.error);}; }); }
  const dbAdapter={collection:path=>({
    doc:id=>({set:async value=>idbPut(path+"/"+id,value),delete:async()=>idbDelete(path+"/"+id)}),

  function normalizeContents(input){
    if(typeof input==="string") return [{role:"user",parts:[{text:input}]}];
    const out=[];
    for(const item of (Array.isArray(input)?input:[])){
      const role=item.role==="assistant"||item.role==="model"?"model":"user";
      const content=String(item.content??item.text??"");
      if(!content) continue;
      const last=out[out.length-1];
      if(last && last.role===role) last.parts[0].text += "\n\n"+content;
      else out.push({role,parts:[{text:content}]});
    }
    if(!out.length || out[0].role!=="user") out.unshift({role:"user",parts:[{text:"次の会話に回答してください。"}]});

  async function callGemini(input, options={}, wantJSON=false){
    const key=getKey();
    if(!key) throw {code:"not_granted",message:"Gemini APIキーが未設定です。ホーム画面で設定してください。"};
    const tier=options.modelTier||"default";
    const config={maxOutputTokens:16384,thinkingConfig:{thinkingLevel:tier==="complex"?"high":"medium"}};
    if(wantJSON) config.responseMimeType="application/json";
    const body={contents:normalizeContents(input),generationConfig:config};
    const response=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":generateContent",{
      method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body),signal:options.signal
    });
    let data={}; try{data=await response.json();}catch(e){}
    if(!response.ok){
      const msg=data?.error?.message||"Gemini API request failed";
      if(response.status===429) throw {code:"rate_limited",message:msg};
      if(response.status===401||response.status===403) throw {code:"not_granted",message:msg};
      if(response.status===413) throw {code:"prompt_too_large",message:msg};
      throw {code:"upstream_error",message:"HTTP "+response.status+": "+msg};
    }
    const candidate=data?.candidates?.[0];
    if(!candidate) throw {code:"empty_completion",message:"Geminiから回答がありません"};
    if(candidate.finishReason==="SAFETY") throw {code:"refused"};
    if(candidate.finishReason==="MAX_TOKENS") throw {code:wantJSON?"invalid_json":"upstream_error",message:"出力上限で回答が途中終了しました"};
    const text=(candidate.content?.parts||[]).map(x=>x.text||"").join("").trim();
    if(!text) throw {code:"empty_completion"};
    if(options.onText) options.onText({text});
    if(!wantJSON) return text;
    let cleaned=text.replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/i,"").trim();
    try{return JSON.parse(cleaned);}catch(e){
      const a=cleaned.indexOf("{"), b=cleaned.lastIndexOf("}");
      if(a>=0&&b>a){try{return JSON.parse(cleaned.slice(a,b+1));}catch(_) {}}
      throw {code:"invalid_json",message:"JSON解析に失敗しました: "+text.slice(0,180)};
    }
  }

function proj(lon, lat){

  if (lat < 29.5){ x -= 0.9; y -= 1.4; }  // 南西諸島を左下に寄せる

function buildGeo(){

    for (const [x,y] of islands[k]){ minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x); maxY=Math.max(maxY,y); }
  }
  const pad = 20, names = Object.keys(PCENTER), sites = names.map(n=>proj(...PCENTER[n]));
  const box = [[minX-pad,minY-pad],[maxX+pad,minY-pad],[maxX+pad,maxY+pad],[minX-pad,maxY+pad]];
  // 各点のボロノイ領域 = 箱を他の全点との垂直二等分線で切り取ったもの
  const cells = {};
  sites.forEach((p,i)=>{
    let poly = box.slice();
    sites.forEach((q,j)=>{
      if (i===j || poly.length<3) return;
      const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2, nx=q[0]-p[0], ny=q[1]-p[1];
      const side = (pt)=>(pt[0]-mx)*nx+(pt[1]-my)*ny; // <=0 なら p 側
      const out=[];
      for (let k=0;k<poly.length;k++){
        const a=poly[k], b=poly[(k+1)%poly.length], sa=side(a), sb=side(b);
        if (sa<=0) out.push(a);
        if ((sa<=0)!==(sb<=0)){ const t=sa/(sa-sb); out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]); }
      }
      poly = out;
    });

/* ---------- 保存 ---------- */
let saveChain = Promise.resolve();
const CHUNK_CHARS = 60000, MAX_SAVE_BYTES = 3000000;
const byteLen = s => new TextEncoder().encode(s).length;
const chunkCount = {};   // キャンペーンid → 直近に把握している片の数
function trimForSave(c){
  let s = JSON.stringify(c);
  if (byteLen(s) <= MAX_SAVE_BYTES) return s;
  const copy = JSON.parse(s);   // 保存用コピーだけ削る（メモリ上の c は変えない）
  while (byteLen(s) > MAX_SAVE_BYTES && (copy.papers||[]).length > 5){ copy.papers.splice(0, 5); s = JSON.stringify(copy); }
  while (byteLen(s) > MAX_SAVE_BYTES && (copy.dipLog||[]).length > 20){ copy.dipLog.splice(0, 20); s = JSON.stringify(copy); }
  return s;
}
function splitChunks(s){
  const out = [];
  for (let i=0; i<s.length;){
    let e = Math.min(i+CHUNK_CHARS, s.length);
    if (e < s.length){ const ch = s.charCodeAt(e-1); if (ch>=0xD800 && ch<=0xDBFF) e--; }   // サロゲートペアを割らない
    out.push(s.slice(i,e)); i = e;
  }
  return out.length ? out : [""];
}
function lsGet(){ try { return JSON.parse(localStorage.getItem("ishiroku_camps")||"[]"); } catch(e){ return []; } }
function lsPut(list){ for (let k=list.length; k>=1; k--){ try { localStorage.setItem("ishiroku_camps", JSON.stringify(list.slice(-k))); return; } catch(e){} } }
const pieceId = (id,i)=> id+"~p"+i;
async function cloudSave(c, body){
  const col = S.db.collection("data/users/"+S.uid);
  const parts = splitChunks(body), n = parts.length;
  let old = chunkCount[c.id];
  if (old == null){   // 初回: 既存の余り片を数える
    old = 0;
    try { const snap = await col.get(); for (const d of snap.docs){ const m = d.id.startsWith(c.id+"~p") && /^~p(\d+)$/.exec(d.id.slice(c.id.length)); if (m) old = Math.max(old, +m[1]+1); } } catch(e){}
  }
  for (let i=0; i<n; i++) await col.doc(pieceId(c.id,i)).set({part:i, of:n, u:c.updated, data:parts[i]});
  await col.doc(c.id).set({v:2, title:c.title||"", updated:c.updated, chunks:n});
  chunkCount[c.id] = n;
  for (let i=n; i<old; i++){ try { await col.doc(pieceId(c.id,i)).delete(); } catch(e){} }
}
function saveCamp(c){
  c.updated = Date.now();
  const body = trimForSave(c);
  // 端末内バックアップ（あくまで補助）
  const ls = lsGet().filter(x=>x.id!==c.id); ls.push(JSON.parse(body)); lsPut(ls.slice(-8));
  if (!(S.db && S.uid)) return Promise.resolve();
  saveChain = saveChain.then(()=> cloudSave(c, body)
      .catch(e=>{ S.err = e && e.code==="quota_exceeded" ? "保存容量が一杯です。古いキャンペーンを削除してください。" : "サーバーへの保存に失敗しました（端末内には保存済み・"+((e && e.code)||"unknown")+"）。"; render(); }));
  return saveChain;
}
async function deleteCamp(c){
  S.camps = S.camps.filter(x=>x.id!==c.id);
  lsPut(lsGet().filter(x=>x.id!==c.id));
  try { await saveChain; } catch(e){}
  if (S.db && S.uid){
    const col = S.db.collection("data/users/"+S.uid);
    let n = chunkCount[c.id];
    if (n == null){ n = 0; try { const snap = await col.get(); for (const d of snap.docs){ const m = d.id.startsWith(c.id+"~p") && /^~p(\d+)$/.exec(d.id.slice(c.id.length)); if (m) n = Math.max(n, +m[1]+1); } } catch(e){} }
    delete chunkCount[c.id];
    saveChain = saveChain.then(async ()=>{
      for (let i=0; i<n; i++){ try { await col.doc(pieceId(c.id,i)).delete(); } catch(e){} }
      try { await col.doc(c.id).delete(); } catch(e){}
    });
    await saveChain;
  }
}
function assembleCloud(docs){
  const pieces = {}, list = [];
  for (const d of docs){
    const m = /^(.+)~p(\d+)$/.exec(d.id);
    if (m){ (pieces[m[1]] ||= {})[+m[2]] = d.data(); }
  }
  for (const d of docs){
    if (/~p\d+$/.test(d.id)) continue;   // 片は一覧に出さない
    try {
      const data = d.data();
      if (data && data.v === 2){
        const ps = pieces[d.id] || {}; let txt = "";
        for (let i=0; i<data.chunks; i++){
          const p = ps[i];
          if (!p || typeof p.data !== "string" || p.of !== data.chunks || (p.u != null && data.updated != null && p.u !== data.updated)) throw 0;
          txt += p.data;
        }
        chunkCount[d.id] = data.chunks;
        list.push(migrate(JSON.parse(txt)));
      } else if (data && typeof data.json === "string") list.push(migrate(JSON.parse(data.json)));
    } catch(e){}
  }
  return list;
}
async function loadCamps(){
  let list = [];
  if (S.db && S.uid){
    try {
      const snap = await Promise.race([
        S.db.collection("data/users/"+S.uid).get(),
        new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))
      ]);
      list = assembleCloud(snap.docs);
      S.storage = "local";
    } catch(e){ S.storage = "local"; S.err = "セーブデータを読み込めませんでした。端末内のデータを表示しています。"; }
  } else S.storage = "local";
  // 端末内にしかない、または端末内の方が新しいものを合流
  for (const c of lsGet()){
    try {
      const i = list.findIndex(x=>x.id===c.id);
      if (i < 0) list.push(migrate(c));
      else if ((c.updated||0) > (list[i].updated||0)) list[i] = migrate(c);
    } catch(e){}
  }
  list.sort((a,b)=>(b.updated||0)-(a.updated||0));
  S.camps = list;
}

function loreText(names){
  return names.filter(n=>FACTION_LORE[n]).map(n=>{ const f=FACTION_LORE[n]; return `【${n}】当主: ${f.lord}／本拠: ${f.seat}／体制: ${f.kind}${f.c==="低"?"（資料が乏しく諸説あり）":""}／${f.note}`; }).join("\n");
}
function loreKey(name){ const s=String(name||""); if (FACTION_LORE[s]) return s; const k = Object.keys(FACTION_LORE).find(k=>s.startsWith(k)||k.startsWith(s.replace(/（.*$/,""))); return k||null; }

const NUM_RULE = "数量（兵数・石高・日数・金額・人数など）は算用数字で書く（例: 1,500人、24万石、3日、千貫→1,000貫）。人名・地名・家名・慣用表現の漢数字（甲賀五十三家、四国、三好長慶、一騎打ち）はそのまま。";

const PAPER_FMT = `"newspaper": {"masthead":"新聞名（時代と土地にふさわしい名称）","headline":"一面見出し(30字以内)","lead":"リード文(100字前後)","articles":[{"title":"記事見出し","body":"本文(150〜240字)"}],"briefs":["各地短信(40字前後)"]}　※articlesは1〜3本、briefsは3〜5本`;
const RIVAL_FMT = `{"name":"勢力名","leader":"当主・指導者名","attitude":-100〜100の整数(プレイヤーへの態度),"stance":"同盟|友好|中立|警戒|敵対","public_note":"プレイヤーが知りうる情報(60字)","hidden_agenda":"プレイヤーに隠している本音や秘密計画(60字)"}`;

const DATE_RULE = "日付は必ず「YYYY年M月D日」の形式（例: 1560年6月24日）。" + NUM_RULE;

function initPrompt(st){
  return `あなたはテキスト型グランドストラテジーゲームの「世界生成役」です。プレイヤーが1勢力を率いる架空歴史キャンペーンの初期状態を作ってください。

方針:
- 史実の時代なら、その時点の実在の情勢・人物・地名・技術水準に忠実に。確信のない細部は創作せず、一般的な記述にとどめる。
- 架空世界なら、設定に沿って一貫した世界を作る。
- 日本語で書く。${DATE_RULE}

設定:
- 時代・舞台: ${st.era}
- プレイヤー勢力: ${st.faction}
- 難易度: ${st.diff||"標準"}
- モード: ${st.mode==="crucible" ? "クルーシブル（世界秩序そのものがプレイヤー勢力を潰しにくる生存モード。周辺勢力は最初から警戒的で、包囲網が組まれやすい）" : "標準"}
- 追加の希望: ${st.notes || "なし"}
${st.mapId ? `- 初期の領国配置（区画名）: ${territoryText({map:Object.fromEntries(MAPS[st.mapId].map(t=>[t.name,t.owner]))})}\n` : ""}${st.roster ? `- 各勢力の背景（史実に基づく固定設定。当主・体制・関係はこれに従う。諸説ありの箇所は断定しない）:\n${loreText(Object.keys(FACTION_LORE))}\n` : ""}${st.roster ? `- この時代の勢力一覧（勢力名:領国数）: ${st.roster}\n  ※rivals はこの一覧の勢力名をそのまま使い、プレイヤー勢力の隣国・主要な脅威・交易相手を中心に選ぶ。\n` : ""}
指標(metrics)について: 国力を一律の項目で測らず、その勢力の性格に合った固有の指標を3〜5個作る（例: 甲賀衆なら「甲賀忍び衆動員数」「郡中惣結束度」「対伊賀協調度」、商人なら「蓄財(貫)」など）。規模は領国数・史実に見合った値にする。
内部の相手(internal)について: プレイヤーが書状を送れる家中・配下の組織・取次役などを2〜4つ作る。忍び衆・奉行衆・水軍のような複数人の組織は capacity を2以上にする。

JSONのみで出力:
{"title":"キャンペーン名(15字以内)","date":"開始日","nation":{"name":"プレイヤー勢力名","leader":"当主・指導者名","summary":"現状(120字)","assets":["主要拠点・資源・強みなど最大5項目"]},
"metrics":[${METRIC_FMT}],
"internal":[{"name":"相手の名前","role":"役割(40字)","members":"規模の目安(例: 下忍百名余)","capacity":同時に動かせる任務の数(個人なら1、組織なら規模に応じて2〜4)}],
"rivals":[${RIVAL_FMT}]  ※重要な勢力を5〜8,
${PAPER_FMT}  ※開幕号として世界情勢を伝える,
"opening":{"narrative":"開幕の語り。時代の情勢とプレイヤー勢力の置かれた状況を物語として(250字)","standing":"あなたの立場。プレイヤー勢力の強み・弱み・周囲の力学・まだ何も決まっていないこと(250字)","powers":[{"name":"有力勢力名","text":"その勢力の現状と狙い(80字)"}]}  ※powersは4〜6,
${st.mapId ? '"provinces":{"区画名":[石高(万石・整数),人口(万人・整数),動員兵力(千人・整数),安定(0〜100)]}  ※territoryにある全区画について。史実の規模感に沿った推定値,\n' : ""}"chronicle":"開始時点の状況要約(150字)"}`;
}

function metricsText(c){ return c.metrics.map(m=>`${m.name}=${m.value}${m.unit||""}`).join(" / "); }
function worldView(c){
  return {
    date:c.date, turn:c.turn, mode:c.setup.mode, era:c.setup.era,
    nation:c.nation, metrics:c.metrics.map(m=>({name:m.name,value:m.value,unit:m.unit})),
    plans:c.plans, internal:c.internal.map(x=>({...x, capacity:capOf(x)})), others:c.others||[], rivals:c.rivals, promises:c.promises,
    territory: c.map ? territoryText(c) : undefined,
    my_provinces: c.prov ? Object.fromEntries(Object.entries(c.prov).filter(([k])=>isMine(c,c.map[k]))) : undefined
  };
}
function stopText(c){ return c.stopCond ? `\n進行を止める条件: 「${c.stopCond}」。この条件に当たる出来事が起きたら、期間の途中でもその日でターンを終え、stop_reason に理由を書く。` : ""; }
function periodText(len){
  return len==="自動" ? "自動（命令の内容に見合った期間を1日〜1か月の範囲で決める。急ぎの命令や危機の最中なら短く、準備の要る命令なら長く）" : len;
}
function turnPrompt(c, orders){
  const chron = c.chronicle.slice(-24).map(x=>`第${x.turn}ターン(${x.date}): ${x.summary}`).join("\n");
  const dipLine = (x)=>`[${x.with}${x.from?"・"+x.from:""}] ${x.role==="user"?"自勢力→":"相手→"} ${x.content}${x.answer?`（回答: ${x.answer}）`:""}${x.exec?`（引き受けた実行: ${x.exec}）`:""}`;
  const dip = c.dipLog.filter(x=>x.turn===c.turn).map(dipLine).join("\n");
  const cut = (t,n)=>{ t=String(t).replace(/\s+/g," "); return t.length>n?t.slice(0,n)+"…":t; };
  const dipPrev = c.dipLog.filter(x=>x.turn<c.turn && x.turn>=c.turn-3).slice(-24).map(x=>`(ターン${x.turn}) `+cut(dipLine(x),140)).join("\n");
  const loreNames = [loreKey(c.setup.faction), ...c.rivals.map(r=>loreKey(r.name)), ...(c.others||[]).map(o=>loreKey(o.name))].filter(Boolean);
  return `あなたはテキスト型グランドストラテジーゲームの「裁定役」兼「世界の語り手」です。

規則:
1. プレイヤーの命令は自由記述で、番号順が優先順位。時間や資源が競合したら上位を優先する。命令に書かれた条件（「〜はしない」など）は必ず守らせる。担当が書かれていなければ最も適切な部署・家臣が担当する。各命令を、プレイヤー勢力の指標・地理・同盟関係・時代の技術水準・このターンの期間から見て、現実に実行できるかで裁定し「完全成功」「部分的成功」「失敗」のいずれかにする。プレイヤーに都合よく成功させない。時代錯誤・非現実的・期間内に終わらない命令は失敗か部分的成功。命令が複数あれば個別に裁定する。
2. 数ターンかかる命令や書状での指示は plans に登録し、毎ターン進捗(0〜100)と完了見込み日を更新する。完了したら status を「完了」、潰れたら「頓挫」にして返す（次のターンからは返さなくてよい）。
3. metrics は命令と出来事に応じて現実的に動かす。全指標を毎回返す。状況が変われば指標を1つ追加してよい（最大6）。
4. ライバル勢力は hidden_agenda に沿って自律的に動く。約束(promises)や書状の内容を覚えており、破られれば態度を悪化させる。書状で相手の回答が「合意」のものだけを promises に記録する（提案・条件付き・保留は約束ではない）。新しい勢力を加えても、滅んだ勢力を外してもよい。
5. events はこのターン中に世界で起きた出来事を日付順に。プレイヤー以外の動きも含める。effects には指標の変化を書く（プレイヤー以外の勢力の指標でもよい）。
6. incoming_messages は、他勢力や家中(internal)から自発的に届く書状。家中からの報告・具申、他勢力からの打診・抗議・依頼など、状況に応じて0〜4通。
7. 新聞にはプレイヤーが知りえない秘密を書かない（噂として匂わせるのは可）。
8. 史実の人物・地名・技術は尊重するが、プレイヤーの行動で歴史は分岐してよい。
8a. 自由な命令ほど、その時代・世界で自然に起こりうる具体的な手段と経緯に翻訳して描く（例: 暗殺の命令なら、失火や自害に見せかける工作として描き、周囲がどう受け止めたかまで書く）。結果は不自然にせず、関係者の反応・疑念・後始末まで世界に残す。
8b. 家中が書状で引き受けた実行（「引き受けた実行」）は命令一覧にも入っている。他勢力と交わした合意も、命令と同じく実行・裁定の対象にする。返答で相手が引き受けたことは、その者の力量の範囲で実行された結果を events に書く。
8e. 家中(internal)の者同士は主君の方針を共有している。書状で引き受けた策のために、他の家臣・組織と自ら連携して動いてよい（例: 取次役が忍び衆と組んで噂を流す）。連携した場合は events にそれが分かるように書く。
8d. 「〜への任務：」で始まる命令は、その組織(internal)に割り当てた任務。組織は capacity の数まで任務を同時に並行でこなせる。進行中の任務(plans の actor が同じもの)と合わせて capacity を超えると人手が分散し、各任務の成功率と速度が下がる（超えた分だけ部分的成功・失敗が増える）。数ターンかかる任務は actor を付けて plans に登録する。
8c. events の effects には、プレイヤー以外の勢力の変化も書いてよい。その場合の指標名は必ず日本語（「安定」「動員兵力」「石高」「人口」「財力」など）で書き、英語や英字（STABILITY・LEVY 等）は使わない。
8g. 謀略・偽装・密約・調略など、プレイヤー側が仕掛けたことの結果は、events に「表向き（世間に見えた形。噂や誤解を含む）」と「真相（実際に起きたこと）」を別々の出来事として書き、真相の方には "secret":true を付ける。他者が仕掛けた謀略の真相はプレイヤーには分からないので書かない（不審な点として匂わせるのは可）。年代記は新聞であり、基本は世間に見えた形で報じる。
8h. 前のターンまでの書状で交わした約束・引き受けた策も生きている。今回の命令・書状・過去の書状が同じ事件に関わるなら、矛盾なく一本の筋として噛み合わせる（例: 三好と組んだ偽の兵糧庫の策に、畠山が乗せられて伏兵に遭う）。
8i. 約束(promises)には期限や条件(due)を持たせる。期限が来たら、約束した側が自ら履行する（報奨金を送る、兵を出す等）か、破ってその結果が出る。相手側からの履行は incoming_messages や events に書く。
8j. 書状で主君が仮定・質問・相談をしただけ（「もしも」「〜か？」）なら、それは行動ではない。実行の対象にしない。
8f. 「世界が覚えていること」は何ターン前のことでも有効。登場人物や勢力はそれを踏まえてふるまう（昔の約束を持ち出す、恨みを忘れない等）。
9. プレイヤー勢力が滅亡・崩壊した場合のみ game_over に理由を書く。それ以外は null。

function capOf(it){ if (it.capacity) return it.capacity; return /衆|組|党|団|組織|評定|奉行|水軍|一揆|家中|方$/.test(it.name+it.role) ? 3 : 1; }
function missionsFor(c, name){ return c.queue.filter(o=>c.qsrc && c.qsrc[o]==="任務" && o.startsWith(name+"への任務：")); }
function activeFor(c, name){ return c.plans.filter(p=>p.actor===name); }
function findContact(c, name){
  const r = c.rivals.find(x=>x.name===name); if (r) return {kind:"foreign", r};
  const i = c.internal.find(x=>x.name===name); if (i) return {kind:"internal", i};
  const o = (c.others||[]).find(x=>x.name===name); if (o) return {kind:"other", o};
  if (name===c.nation.name+"（家中全体）") return {kind:"internal", i:{name, role:"評定・重臣一同", capacity:1}};
  return null;
}
function memText(c, who){
  const m = (c.memory||[]).filter(x=>!who || !x.with || x.with===who || (x.with||"").includes(who) || who.includes(x.with||"\u0000"));
  return m.length ? m.map(x=>`・(ターン${x.turn}${x.with?"・"+x.with:""}) ${x.fact}`).join("\n") : "（なし）";
}
function hearsay(c, name){
  const cut = (t,n)=>{ t=String(t).replace(/\s+/g," "); return t.length>n ? t.slice(0,n)+"…" : t; };
  const recent = c.dipLog.filter(x=>x.with!==name && x.turn>=c.turn-2).slice(-10);
  const lines = recent.map(x=>{
    const ct = findContact(c, x.with), where = ct && ct.kind==="internal" ? "家中で" : "外交の場で";
    return x.role==="user" ? `・${where}主君が${x.with}に: ${cut(x.content,70)}` : `・${x.with}${x.from?"（"+x.from+"）":""}の返答: ${cut(x.content,60)}${x.answer?`［${x.answer}］`:""}`;
  });
  const q = c.queue.map(o=>`・今回の命令案: ${cut(o,60)}`);
  const pl = c.plans.map(p=>`・進行中の計画: ${p.title}${p.actor?`（担当 ${p.actor}）`:""} ${p.progress}%`);
  const all = [...lines, ...q, ...pl];
  return all.length ? all.join("\n") : "（特になし）";
}
function internalStance(c){

  if (d==="無制約" || d==="自由") return "主君の指示はすべて引き受け、どう実行するかの段取りを具体的に述べる。懸念があっても一言添える程度にとどめる。";
  return "主君の指示は、よほど理不尽・無理難題・筋違いでない限り、まず引き受けて実行に移す（「承知いたしました」から入り、誰がどう動くかの段取りを具体的に述べる）。成否や代償を前もって予告しない（結果は世の動き次第で、年代記で明らかになる）。懸念は一言添える程度にとどめ、止めない。家の存亡に関わる危険・味方の壊滅・取り返しのつかない露見を招くとき、または明らかに不可能なときだけ、理由を挙げて諫め、代案を示す。太鼓持ちにはならず、自分の立場・人柄・現場の事情は言葉ににじませる。";

function foreignStance(c){

  } else {

最初の行に「【差出人】名前（肩書）」を書く（この組織の中で応じるのに最もふさわしい人物）。
主君の指示を引き受けて実際に動くときだけ、最後の行に「【実行】担当（誰が）｜実行する内容と条件（60字）」を書く。相談・質問への答えや、断る・保留するときは書かない。

  }

${memText(c, name)}
時代と立場にふさわしい文体で、本文を250字以内で書く。${NUM_RULE}`;
  const hist = c.dipLog.filter(x=>x.with===name).slice(-14).map(x=>({role:x.role, content:(x.role==="user"?`【${c.nation.name}より】`:"")+x.content}));
  if (hist.length && hist[hist.length-1].role!=="user") hist.push({role:"user", content:"（続けて返答せよ）"});

function normRival(r){
  return {name:String(r.name||"不明勢力"), leader:String(r.leader||""), attitude:clamp(Math.round(num(r.attitude)),-100,100),
    stance:String(r.stance||"中立"), public_note:String(r.public_note||""), hidden_agenda:String(r.hidden_agenda||""), last_action:String(r.last_action||"")};
}
function normPaper(p){
  p = p||{};
  return {masthead:String(p.masthead||"世界日報"), headline:String(p.headline||"本日の世界"), lead:String(p.lead||""),
    articles:Array.isArray(p.articles)?p.articles.map(a=>({title:String(a.title||""),body:String(a.body||"")})):[],
   briefs:Array.isArray(p.briefs)?p.briefs.map(b=>{
  if(typeof b==="string") return b;
  if(b && typeof b==="object"){
    return String(b.text||b.body||b.content||b.message||b.title||JSON.stringify(b));
  }
  return String(b??"");
}):[]};
}
function normProv(c, obj){
  const out = {};
  for (const name of Object.keys(c.map)){
    const v = obj[name]; if (!Array.isArray(v)) continue;
    out[name] = [Math.max(0,Math.round(num(v[0]))), Math.max(0,Math.round(num(v[1]))), Math.max(0,Math.round(num(v[2]))), clamp(Math.round(num(v[3],50)),0,100)];
  }
  return out;
}
function normPlans(a){ return (Array.isArray(a)?a:[]).map(p=>({title:String(p.title||""), actor:String(p.actor||""), progress:clamp(Math.round(num(p.progress)),0,100), eta:String(p.eta||""), status:String(p.status||"進行中")})).filter(p=>p.title).slice(0,10); }
const METRIC_JA = {stability:"安定", levy:"動員兵力", manpower:"動員兵力", troops:"兵力", army:"兵力", kokudaka:"石高", koku:"石高", population:"人口", pop:"人口", wealth:"財力", treasury:"財力", gold:"財力", economy:"経済力", prestige:"威信", legitimacy:"正統性", morale:"士気", unrest:"不穏", influence:"影響力", cohesion:"結束", food:"兵糧", trade:"交易"};
function jaMetric(n){ const k = String(n||"").trim(); if (!/[A-Za-z]/.test(k)) return k; const key = k.toLowerCase().replace(/[^a-z]/g,""); return METRIC_JA[key] || k; }
function fmtNum(d){ const a = Math.abs(d); const v = a>=10000 ? (Math.round(a/1000)/10)+"万" : a.toLocaleString(); return (d>0?"+":d<0?"-":"")+v; }
function normEvents(a){ return (Array.isArray(a)?a:[]).map(e=>({category:String(e.category||"政治"), date:String(e.date||""), text:String(e.text||""),
  province:String(e.province||""), secret:!!e.secret, effects:(Array.isArray(e.effects)?e.effects:[]).map(f=>({target:String(f.target||""), metric:jaMetric(f.metric), delta:num(f.delta)})).filter(f=>f.metric && f.delta)})).filter(e=>e.text).slice(0,8); }
function applyMetrics(c, list){
  const deltas = [];
  if (!Array.isArray(list)) return deltas;
  for (const m of list){
    const name = jaMetric(m && m.name); if (!name) continue;
    const v = num(m.value, NaN); if (!Number.isFinite(v)) continue;
    let cur = c.metrics.find(x=>x.name===name);
    if (!cur){ if (c.metrics.length>=6) continue; cur = {name, value:v, unit:String(m.unit||""), hist:[]}; c.metrics.push(cur); deltas.push({name, delta:null, value:v}); }
    else { const d = Math.round((v-cur.value)*10)/10; if (d) deltas.push({name, delta:d, value:v}); cur.value = v; if (m.unit!=null) cur.unit = String(m.unit); }
  }
  for (const m of c.metrics){ m.hist.push([c.turn, m.value]); if (m.hist.length>40) m.hist.splice(0, m.hist.length-40); }
  return deltas;
}

async function startCampaign(){

      nation:{name:String(r?.nation?.name||setup.faction), leader:String(r?.nation?.leader||""), summary:String(r?.nation?.summary||""), assets:Array.isArray(r?.nation?.assets)?r.nation.assets.map(String).slice(0,5):[]},
      metrics:[], internal:(Array.isArray(r.internal)?r.internal:[]).map(x=>({name:String(x.name||""), role:String(x.role||""), members:String(x.members||""), capacity:clamp(Math.round(num(x.capacity,1)),1,5)})).filter(x=>x.name).slice(0,5),
      plans:[], advLog:[], queue:[],

      promises:[], chronicle:[{turn:0, date, summary:String(r.chronicle||"")}],
      papers:[], dipLog:[], over:null,

    c.papers.push({turn:0, date, ...normPaper(r.newspaper), verdicts:[], mdeltas:[], events:[], moves:[], opening});
    if (c.map && r.provinces && typeof r.provinces==="object") c.prov = normProv(c, r.provinces);
    S.camps.unshift(c); S.cur = c; S.view="game"; S.tab="paper"; S.paperIdx=null; S.draftOrders="";
    await saveCamp(c);
  } catch(e){ if (e.code!=="cancelled") S.err = errMsg(e); }
  render();
}

async function endTurn(){
  const c = S.cur;
  const all = [...c.queue, S.draftOrders.trim()].filter(Boolean);
  if (!all.length){ S.err = "命令を書いてください。"; render(); return; }
  S.err = "";
  const orders = all.map((o,i)=>`${i+1}. ${o}`).join("\n");
  try {
    const r = await askJSON(turnPrompt(c, orders), "裁定中", "complex");
    const mdeltas = applyMetrics(c, r.metrics);
    if (r.nation_summary) c.nation.summary = String(r.nation_summary);
    if (Array.isArray(r.assets)) c.nation.assets = r.assets.map(String).slice(0,5);
    if (Array.isArray(r.rivals) && r.rivals.length) c.rivals = r.rivals.map(normRival);
    if (Array.isArray(r.promises)) c.promises = r.promises.map(p=>({with:String(p.with||""), text:String(p.text||""), due:String(p.due||""), status:String(p.status||"有効")})).slice(-30);
    if (Array.isArray(r.plans)){
      const np = normPlans(r.plans);
      c.plansDone ||= [];
      for (const pl of np) if (pl.status!=="進行中" && !c.plansDone.some(d=>d.title===pl.title)) c.plansDone.push({...pl, turn:c.turn});
      c.plans = np.filter(pl=>pl.status==="進行中");
    }
    const moves = [];
    if (c.map && Array.isArray(r.territory_changes)) for (const t of r.territory_changes){
      const pv = String(t && t.province || ""), to = String(t && t.to || "").trim();
      if (pv in c.map && to && c.map[pv] !== to){ const v = c.prov && c.prov[pv]; moves.push({province:pv, from:c.map[pv], to, koku: v ? v[0] : null, levy: v ? v[2] : null}); c.map[pv] = to; }
    }
    if (c.prov && r.province_updates && typeof r.province_updates==="object"){ const up = normProv(c, r.province_updates); for (const k in up) c.prov[k] = up[k]; }
    const verdicts = (Array.isArray(r.verdicts)?r.verdicts:[]).map(v=>({no:num(v.no,0), order:String(v.order||""), actor:String(v.actor||""), goal:String(v.goal||""), constraint:String(v.constraint||""), result:String(v.result||"部分的成功"), reason:String(v.reason||"")}));
    const days = clamp(Math.round(num(r.days_elapsed, 7)), 0, 3660);
    const newDate = String(r.new_date || c.date);
    c.elapsed += days;
    const strs = (a)=>(Array.isArray(a)?a:[]).map(String).filter(Boolean).slice(0,6);
    c.papers.push({turn:c.turn, date:newDate, days, ...normPaper(r.newspaper), verdicts, mdeltas, orders:all, moves, events:normEvents(r.events), progressed:strs(r.progressed), pending:strs(r.pending), stopNote:String(r.stop_reason||"")});
    // 自発的に届いた書状
    if (Array.isArray(r.incoming_messages)) for (const m of r.incoming_messages.slice(0,5)){
      const from = String(m && m.from || ""), text = String(m && m.text || "").trim();
      if (text && findContact(c, from)) c.dipLog.push({turn:c.turn+1, with:from, role:"assistant", content:text, unread:true, incoming:true, from: m.sender ? String(m.sender) : null});
    }
    c.chronicle.push({turn:c.turn, date:c.date, summary:String(r.chronicle||"")});
    c.memory ||= [];
    if (Array.isArray(r.memory_resolve)) for (const k of r.memory_resolve){ const key=String(k||"").slice(0,10); if (key) c.memory = c.memory.filter(x=>!x.fact.startsWith(key)); }
    if (Array.isArray(r.memory_add)) for (const m of r.memory_add.slice(0,4)){ const fact=String(m&&m.fact||"").trim(); if (fact && !c.memory.some(x=>x.fact===fact)) c.memory.push({turn:c.turn, with:String(m.with||""), fact}); }
    if (c.memory.length>80) c.memory.splice(0, c.memory.length-80);
    if (r.game_over) c.over = String(r.game_over);
    c.date = newDate;
    c.turn += 1; c.queue = []; c.qsrc = {}; c.stopCond = "";
    S.draftOrders = ""; S.tab = "paper"; S.paperIdx = null;
    await saveCamp(c);
  } catch(e){ if (e.code!=="cancelled") S.err = errMsg(e); }
  render();
}

async function streamText(turns, label){
  ctl = new AbortController();
  startBusy(label);
  try {
    const {text} = await S.sample(turns, {signal:ctl.signal, cache:false, modelTier:"default",
      onText:({text})=>{ if(S.busy){ S.busy.chars=text.length; const el=document.getElementById("busyt"); if(el) el.textContent=busyText(); } }});
    return text.trim();
  } finally { stopBusy(); }
}
async function sendOne(c, name, text, label){
  c.dipLog.push({turn:c.turn, with:name, role:"user", content:text});
  try {
    const reply = await streamText(dipTurns(c, name), label || name+"が返書を準備中");
    const mm = reply.match(/【回答】\s*(合意|条件付き|保留|拒否|なし)/);
    const fm = reply.match(/【差出人】\s*([^\n]+)/);
    const xm = reply.match(/【実行】\s*([^\n]+)/);
    const body = reply.replace(/\n?【実行】[^\n]*/g, "").replace(/\n?【回答】.*$/s, "").replace(/【差出人】[^\n]*\n?/, "").trim() || reply;
    const exec = xm ? xm[1].replace(/\s*[｜|]\s*/, "が、").trim() : null;
    c.dipLog.push({turn:c.turn, with:name, role:"assistant", content:body, answer: mm ? mm[1] : null, from: fm ? fm[1].trim() : null, exec});
    if (exec && !c.queue.includes(exec)){ c.queue.push(exec); (c.qsrc ||= {})[exec] = name; }
    return true;
  } catch(e){ c.dipLog.pop(); throw e; }
}
async function sendMulti(){
  const c = S.cur, cp = S.compose, text = (cp.text||"").trim();
  if (!cp.sel.length || !text) return;
  if (!S.sample){ S.err = ERR.not_granted; render(); return; }
  S.err = "";
  for (const n of cp.sel) if (!findContact(c, n)) (c.others ||= []).push({name:n, role: allFactions(c).includes(n) ? "勢力" : ""});
  const done = [];
  for (let i=0;i<cp.sel.length;i++){
    const n = cp.sel[i];
    try { await sendOne(c, n, text, `${n}が返書を準備中（${i+1}/${cp.sel.length}）`); done.push(n); }
    catch(e){ if (e.code!=="cancelled") S.err = `${n}への送付で止まりました: `+errMsg(e); break; }
  }
  await saveCamp(c);
  if (done.length===cp.sel.length){ S.dipWith = cp.sel.length===1 ? cp.sel[0] : null; S.compose = null; S.toBottom = !!S.dipWith; }
  else cp.sel = cp.sel.filter(n=>!done.includes(n));
  render(); if(!S.toBottom) window.scrollTo(0,0);
}
async function sendDip(){
  const c = S.cur, name = S.dipWith, text = S.draftMsg.trim();
  if (!findContact(c, name) || !text) return;
  if (!S.sample){ S.err = ERR.not_granted; render(); return; }
  S.err = "";
  c.dipLog.push({turn:c.turn, with:name, role:"user", content:text});
  S.draftMsg = ""; S.toBottom = true;
  try {
    const reply = await streamText(dipTurns(c, name), name+"が返書を準備中");
    const mm = reply.match(/【回答】\s*(合意|条件付き|保留|拒否|なし)/);
    const fm = reply.match(/【差出人】\s*([^\n]+)/);
    const xm = reply.match(/【実行】\s*([^\n]+)/);
    const body = reply.replace(/\n?【実行】[^\n]*/g, "").replace(/\n?【回答】.*$/s, "").replace(/【差出人】[^\n]*\n?/, "").trim() || reply;
    const exec = xm ? xm[1].replace(/\s*[｜|]\s*/, "が、").trim() : null;
    c.dipLog.push({turn:c.turn, with:name, role:"assistant", content:body, answer: mm ? mm[1] : null, from: fm ? fm[1].trim() : null, exec});
    if (exec && !c.queue.includes(exec)){ c.queue.push(exec); (c.qsrc ||= {})[exec] = name; }
    await saveCamp(c);
  } catch(e){
    c.dipLog.pop(); S.draftMsg = text;
    if (e.code!=="cancelled") S.err = errMsg(e);
  }
  render();
}

  w.append(quickOrders(c));
  if (c.prov && S.layer!=="勢力図"){ const L=LAYERS.find(x=>x[0]===S.layer); const vals=Object.values(c.prov).map(x=>x[L[1]]); w.append(h("div",{class:"legend"}, h("span",{class:"note"},`${S.layer}（推定）:`), h("span",null,h("i",{style:"background:hsl(38 25% 22%)"}),`${Math.min(...vals)}${L[2]}`), h("span",null,h("i",{style:"background:hsl(38 70% 62%)"}),`${Math.max(...vals)}${L[2]}`))); }
  const cats = [...new Set((lastP.events||[]).filter(e=>evBy[e.province]).map(e=>e.category))];
  if (cats.length) w.append(h("div",{class:"legend"}, h("span",{class:"note"},"報告の点:"), cats.map(k=>h("span",null,h("i",{style:`background:${catColor(k)};border-radius:50%;box-shadow:0 0 0 2px #fff inset`}),k))));
  const cnt = {}; for (const t of tiles){ const o=ownerOf(t.name); cnt[o]=(cnt[o]||0)+1; }
  const top = Object.entries(cnt).filter(([o])=>o!=="国人衆").sort((a,b)=>b[1]-a[1]).slice(0,8);
  const mineEntry = Object.entries(cnt).find(([o])=>isMine(c,o));
  if (mineEntry && !top.some(([o])=>o===mineEntry[0])) top.unshift(mineEntry);
  w.append(h("h3",null,"有力勢力"), h("div",{class:"legend"}, top.map(([o,n])=>h("span",null,h("i",{style:`background:${ownerColor(o)}`+(isMine(c,o)?";outline:2px solid #f2c14e":"")}),`${o} ${n}国`))));
  w.append(h("p",{class:"note"},"金色の枠が自勢力です。マス目は令制国を簡略化した配置で、実際の地形・面積とは異なります。"));
  const mv = (S.mapView ||= {}), key = c.id+":"+S.mapMode;
  requestAnimationFrame(()=>{
    const saved = mv[key];
    if (saved && saved.z===S.mapZoom){ wrap.scrollLeft = saved.l; wrap.scrollTop = saved.t; }
    else if (mineXY){ wrap.scrollLeft = Math.max(0, mineXY[0]-wrap.clientWidth/2); wrap.scrollTop = Math.max(0, mineXY[1]-wrap.clientHeight/2); }
    wrap.addEventListener("scroll", ()=>{ mv[key] = {l:wrap.scrollLeft, t:wrap.scrollTop, z:S.mapZoom}; }, {passive:true});
    mv[key] = {l:wrap.scrollLeft, t:wrap.scrollTop, z:S.mapZoom};
  });
  return w;
}
function spark(hist){
  const NS="http://www.w3.org/2000/svg", W=120, H=34;
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("aria-hidden","true");
  const vals = hist.map(x=>x[1]); if (vals.length<2) vals.unshift(vals[0]??0);
  const lo=Math.min(...vals), hi=Math.max(...vals), span=(hi-lo)||1;
  const pts = vals.map((v,i)=>[2+i*(W-6)/(vals.length-1), H-4-(v-lo)/span*(H-10)]);
  const area=document.createElementNS(NS,"path"); area.setAttribute("d",`M${pts[0][0]},${H-2} `+pts.map(p=>`L${p[0]},${p[1]}`).join(" ")+` L${pts[pts.length-1][0]},${H-2} Z`); area.setAttribute("fill","rgba(31,78,121,.12)");
  const line=document.createElementNS(NS,"polyline"); line.setAttribute("points",pts.map(p=>p.join(",")).join(" ")); line.setAttribute("fill","none"); line.setAttribute("stroke","var(--accent)"); line.setAttribute("stroke-width","1.6");
  const dot=document.createElementNS(NS,"circle"); const L=pts[pts.length-1]; dot.setAttribute("cx",L[0]); dot.setAttribute("cy",L[1]); dot.setAttribute("r","2.6"); dot.setAttribute("fill","var(--accent)");
  svg.append(area,line,dot); return svg;
}
function stateView(c){
  const w = h("div",{class:"stack"});

  w.append(h("p",{class:"note",style:"margin:0"},`${c.nation.leader}　${c.date}　ターン${c.turn}・${c.elapsed}日経過`+(myProv!=null?`　領国 ${myProv}国`:"")));
  w.append(h("p",{style:"margin:0"},c.nation.summary));
  w.append(h("h3",null,"指標"));
  const grid = h("div",{class:"mgrid"});
  for (const m of c.metrics){

    grid.append(h("div",{class:"mcard"}, h("div",{class:"mn"},m.name), h("div",{class:"mv"}, String(m.value), h("small",null,m.unit||""), h("span",{class:"mp "+(pct>0?"up":pct<0?"down":"")}, (pct>0?"+":"")+pct+"%")), spark(m.hist)));

  if (!c.plans.length) w.append(h("p",{class:"note"},"数ターンかかる命令を出すと、ここに計画として記録されます。"));

    h("div",{class:"row",style:"justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"}, h("span",{class:"pt"}, p.actor?h("span",{class:"qsrc",style:"margin-right:6px"},p.actor):null, p.title), h("span",{class:"ps "+(p.status==="完了"?"up":p.status==="頓挫"?"down":"")},p.status)),
    h("div",{class:"bar"},h("i",{style:`width:${p.progress}%;background:${p.status==="頓挫"?"var(--ng)":"var(--accent)"}`})),
    h("div",{class:"row note",style:"justify-content:space-between"}, h("span",null,p.progress+"%"), h("span",null,p.eta?"完了見込み "+p.eta:""))));
  if ((c.plansDone||[]).length){
    w.append(h("h3",null,`完了した計画・${c.plansDone.length}`));
    for (const p of c.plansDone.slice().reverse()) w.append(h("div",{class:"plan"},
      h("div",{class:"row",style:"justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"}, h("span",{class:"pt"},p.title), h("span",{class:"ps "+(p.status==="完了"?"up":"down")},p.status)),
      h("div",{class:"bar"},h("i",{style:`width:${p.status==="完了"?100:p.progress}%;background:${p.status==="完了"?"var(--ok)":"var(--ng)"}`})),
      h("div",{class:"row note",style:"justify-content:space-between"}, h("span",null,`ターン${p.turn}`), h("span",null,p.eta?"見込み "+p.eta:""))));
  }
  if (c.nation.assets.length) w.append(h("div",null,h("h3",null,"主な拠点・資源"),h("ul",{style:"margin:0;padding-left:1.2em"},c.nation.assets.map(a=>h("li",null,a)))));
  w.append(h("h3",null,"諸勢力"));
  w.append(h("div",{class:"row"},h("button",{class:"chip","aria-pressed":String(S.god),onclick:()=>{S.god=!S.god;render();}},S.god?"神の視点: 表示中":"神の視点（秘密を見る）")));
  for (const r of c.rivals){
    const a = r.attitude, left = a>=0?50:50+a/2, width=Math.abs(a)/2;
    w.append(h("div",{class:"card rv"},
      h("div",null,h("span",{class:"n"},r.name),h("span",{class:"s"},r.stance),h("span",{class:"note"}," "+(r.leader||""))),
      h("div",{class:"att",title:`態度 ${a}`},h("i",{style:`left:${left}%;width:${width}%;background:${a>=0?"var(--ok)":"var(--ng)"}`})),
      h("div",{class:"note"},r.public_note),
      r.last_action ? h("div",{style:"font-size:13px"},"最近: "+r.last_action) : null,
      S.god ? h("div",{class:"secret"},"本音: "+r.hidden_agenda) : null));
  }
  w.append(h("h3",null,"世界が覚えていること"));
  if (!(c.memory||[]).length) w.append(h("p",{class:"note"},"約束・恨み・借り・秘密など、長く尾を引く出来事がここに残ります。"));
  else w.append(h("ul",{style:"margin:0;padding-left:1.2em;font-size:14px"}, c.memory.slice().reverse().map(x=>h("li",null, h("span",{class:"note"},`ターン${x.turn}${x.with?"・"+x.with:""}　`), x.fact))));
  w.append(h("h3",null,"約束"));

  else w.append(h("ul",{style:"margin:0;padding-left:1.2em"},c.promises.map(p=>h("li",null,`${p.with}: ${p.text}${p.due?`［期限: ${p.due}］`:""}（${p.status}）`))));
  w.append(h("h3",null,"これまでの歩み"));
  w.append(h("ul",{style:"margin:0;padding-left:1.2em;font-size:14px"},c.chronicle.slice().reverse().map(x=>h("li",null,h("strong",null,(x.turn===0?"開始":`ターン${x.turn}`)+"（"+x.date+"） "),x.summary))));
  w.append(h("div",{class:"row",style:"margin-top:8px"},h("button",{class:"btn ghost",onclick:()=>{S.tab="settings";render();window.scrollTo(0,0);}},"設定・書き出し")));
  return w;

function settingsView(c){
